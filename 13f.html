<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>个人持仓披露 · 13F 风格</title>
<style>
  :root {
    --paper:#f7f5f0; --card:#fff; --ink:#1e2329; --muted:#6f7680;
    --line:#e8e4dc; --gold:#f0b90b; --up:#0a9d62; --down:#f6465d;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system,"PingFang SC","Noto Sans SC",serif; }
  main { max-width:920px; margin:0 auto; padding:28px 18px 64px; }
  .header { text-align:center; margin-bottom:24px; }
  .header h1 { font-size:22px; margin:0 0 4px; letter-spacing:.5px; color:#c99a08; font-weight:600; }
  .header .sub { color:var(--muted); font-size:13px; }
  .meta { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 18px; margin-bottom:16px; display:grid; grid-template-columns:1fr 1fr; gap:10px 20px; font-size:13.5px; }
  .meta b { display:block; color:var(--muted); font-weight:500; font-size:12px; margin-bottom:2px; }
  .summary { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 18px; margin-bottom:18px; }
  .summary h2 { font-size:16px; margin:0 0 10px; }
  .sum-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
  .sum-grid div { }
  .sum-grid b { display:block; font-size:20px; font-variant-numeric:tabular-nums; }
  .sum-grid span { color:var(--muted); font-size:12px; }
  .note { color:var(--muted); font-size:12px; margin-top:10px; line-height:1.5; }
  table { width:100%; border-collapse:collapse; background:var(--card); border-radius:16px; overflow:hidden; border:1px solid var(--line); font-size:13.5px; }
  th { background:#faf8f4; text-align:left; padding:10px 12px; font-weight:600; color:#1e2329; border-bottom:1px solid var(--line); }
  td { padding:11px 12px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
  tr:last-child td { border-bottom:0; }
  .right { text-align:right; }
  .ticker { color:var(--muted); font-size:12px; }
  .pct { color:var(--muted); font-size:12px; }
  .down { color:var(--down); }
  .up { color:var(--up); }
  .footer { margin-top:18px; color:var(--muted); font-size:12px; line-height:1.5; }
  @media (max-width:640px) {
    .meta, .sum-grid { grid-template-columns:1fr; }
    table { font-size:12.5px; }
    th, td { padding:8px 8px; }
  }
</style>
</head>
<body>
<main>
  <div class="header">
    <h1>个人持仓披露</h1>
    <div class="sub">Personal Holdings Report · 13F-Style Information Table</div>
    <div class="sub" id="asof" style="margin-top:4px">读取本机已保存的仓位</div>
  </div>
  <div id="report"></div>
  <div class="footer">
    数据来自本机已保存的持仓，和持仓地图同一份。只显示点过「保存仓位」或同步之后的数据，未保存的改动不会出现在这里。<br>
    返回 <a href="index.html" style="color:#c99a08">持仓地图</a>
  </div>
</main>
<script>
const KEY = "holdings-map-phone-v5";
function money(n) { return Number(n || 0).toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, function (c) {
    if (c === "&") return "&" + "amp;";
    if (c === "<") return "&" + "lt;";
    if (c === ">") return "&" + "gt;";
    if (c === '"') return "&" + "quot;";
    return "&" + "#39;";
  });
}
function mv(l) {
  if (l.type === "cash") return Number(l.shares) || Number(l.cost) || 0;
  if (Number(l.shares) > 0 && Number(l.price) > 0) return Number(l.shares) * Number(l.price);
  return Number(l.cost) || 0;
}
function kind(l) {
  if (l.type === "cash") return "现金";
  if (l.type === "fund") return "场外基金";
  return "普通股";
}
let data = null;
try { data = JSON.parse(localStorage.getItem(KEY) || "null"); } catch {}
const box = document.getElementById("report");
if (!data || !Array.isArray(data.lots) || !data.lots.length) {
  box.innerHTML = '<div class="summary">这台设备还没有已保存的仓位。先打开持仓地图，确认数据后点「保存仓位」。</div>';
} else {
  const lots = data.lots;
  const rows = lots.map(l => ({ l, v: mv(l) })).sort((a, b) => b.v - a.v);
  const total = rows.reduce((a, b) => a + b.v, 0) || 1;
  const cash = rows.filter(x => x.l.type === "cash").reduce((a, b) => a + b.v, 0);
  const when = data.savedAt ? new Date(data.savedAt).toLocaleString("zh-CN", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" }) : "未知";
  document.getElementById("asof").textContent = "报告时点：" + when + " · 按已保存现价";
  const body = rows.map(x => {
    const p = x.v - Number(x.l.cost || 0);
    const cls = p < -0.005 ? "down" : p > 0.005 ? "up" : "";
    const sh = x.l.type === "cash" ? money(x.v).replace(/\.00$/, "") : (Number(x.l.shares) > 0 ? x.l.shares + " SH" : "—");
    return `<tr>
      <td>${esc(x.l.name)}<br><span class="ticker">${esc(x.l.ticker)} · ${x.l.type === "cash" ? "CASH" : x.l.type === "fund" ? "FUND" : "COM"}</span></td>
      <td>${kind(x.l)}</td>
      <td class="right">${money(x.v)}</td>
      <td class="right">${esc(sh)}</td>
      <td class="right">${(x.v / total * 100).toFixed(2)}%</td>
      <td class="right">${money(x.l.cost || 0)}</td>
      <td class="right ${cls}">${p >= 0 ? "+" : ""}${money(p)}</td>
    </tr>`;
  }).join("");
  box.innerHTML = `
    <div class="summary">
      <h2>汇总</h2>
      <div class="sum-grid">
        <div><b>${money(total === 1 && rows.every(x => x.v === 0) ? 0 : rows.reduce((a,b)=>a+b.v,0))}</b><span>总市值 U</span></div>
        <div><b>${money(cash)}</b><span>现金 U（${(cash / total * 100).toFixed(1)}%）</span></div>
        <div><b>${money(rows.reduce((a,b)=>a+b.v,0) - cash)}</b><span>非现金仓位（${((rows.reduce((a,b)=>a+b.v,0) - cash) / total * 100).toFixed(1)}%）</span></div>
      </div>
      <div class="note">说明：13F 主要披露美国上市权益证券。本页按同样表格结构列出全部持仓（含现金与场外基金），仅供个人查看，不是正式 SEC 申报。</div>
    </div>
    <table>
      <thead><tr>
        <th>发行人</th><th>类别</th><th class="right">市值 U</th><th class="right">股数 / 金额</th>
        <th class="right">占比</th><th class="right">成本 U</th><th class="right">浮动盈亏</th>
      </tr></thead>
      <tbody>${body}</tbody>
    </table>`;
}
</script>
</body>
</html>
