<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>持仓地图</title>
<style>
  :root { --paper:#f3efe6; --card:#fffcf7; --ink:#1c1917; --muted:#6f6a63; --line:#e4ddd1; --up:#1f7a4d; --down:#b42318; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:"PingFang SC","Noto Sans SC",sans-serif; }
  main { max-width:720px; margin:0 auto; padding:16px 12px 40px; }
  h1 { font-size:28px; margin:0 0 4px; font-weight:500; }
  p.sub { color:var(--muted); font-size:13px; margin:0 0 14px; }
  .kpis { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px; }
  .kpi { background:var(--card); border-radius:16px; padding:12px 14px; box-shadow:0 8px 20px rgb(28 25 23 / .05); }
  .kpi b { display:block; font-size:18px; margin-top:2px; }
  .kpi span { color:var(--muted); font-size:12px; }
  .card { background:var(--card); border-radius:16px; padding:12px; margin-bottom:10px; box-shadow:0 8px 20px rgb(28 25 23 / .05); }
  .row { display:flex; justify-content:space-between; gap:8px; }
  .name { font-weight:600; }
  .ticker { color:var(--muted); font-size:12px; }
  .mv { text-align:right; font-variant-numeric:tabular-nums; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  label { font-size:12px; color:var(--muted); display:block; }
  input { width:100%; margin-top:4px; height:40px; border:1px solid var(--line); border-radius:8px; background:#f7f3ea; padding:0 10px; font-size:16px; }
  .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  button { height:44px; border:0; border-radius:10px; padding:0 14px; font-size:14px; font-weight:600; }
  .accent { background:var(--up); color:#fff; }
  .secondary { background:#ece6da; color:var(--ink); border:1px solid var(--line); }
  .up { color:var(--up); } .down { color:var(--down); }
  .note { color:var(--muted); font-size:12px; align-self:center; }
</style>
</head>
<body>
<main>
  <h1>持仓地图</h1>
  <p class="sub">改完数字点保存。现价点拉取币安。数据存在这台手机里。</p>
  <section class="kpis" id="kpis"></section>
  <section id="lots"></section>
  <div class="actions">
    <button class="accent" id="save">保存仓位</button>
    <span class="note" id="status">点保存后刷新仍是你的数字</span>
    <button class="accent" id="quotes">拉取币安现价</button>
  </div>
</main>
<script>
const KEY = "holdings-map-phone-v1";
const SEED = [
  {id:"usdt",name:"现金 U",ticker:"USDT",type:"cash",shares:25970,cost:25970,price:1},
  {id:"crcl",name:"Circle",ticker:"CRCL",type:"stock",shares:137.3,cost:10450,price:78.97},
  {id:"rklb",name:"Rocket Lab",ticker:"RKLB",type:"stock",shares:50.3,cost:3380,price:51.415},
  {id:"pdd",name:"拼多多",ticker:"PDD",type:"stock",shares:0,cost:0,price:82.1},
  {id:"otc",name:"场外基金",ticker:"OTC",type:"fund",shares:0,cost:5200,price:0},
  {id:"dram",name:"Memory ETF",ticker:"DRAM",type:"stock",shares:0,cost:0,price:47.21}
];
let lots = load();
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    const data = raw ? JSON.parse(raw) : null;
    if (data && Array.isArray(data.lots) && data.lots.length) return data.lots;
  } catch {}
  return SEED.map(x => ({...x}));
}
function money(n) { return Number(n||0).toLocaleString("zh-CN", {maximumFractionDigits:2}); }
function mv(l) {
  if (l.type === "cash") return Number(l.shares) || Number(l.cost) || 0;
  if (Number(l.shares) > 0 && Number(l.price) > 0) return Number(l.shares) * Number(l.price);
  return Number(l.cost) || 0;
}
function totals() {
  const value = lots.reduce((a,b)=>a+mv(b),0);
  const cash = lots.filter(x=>x.type==="cash").reduce((a,b)=>a+mv(b),0);
  const cost = lots.reduce((a,b)=>a+Number(b.cost||0),0);
  const cashCost = lots.filter(x=>x.type==="cash").reduce((a,b)=>a+Number(b.cost||0),0);
  return {value, cash, invested:value-cash, investedCost:cost-cashCost, pnl:value-cost};
}
function render() {
  const t = totals();
  document.getElementById("kpis").innerHTML = [
    ["总市值", money(t.value)+" U"],
    ["现金 U", money(t.cash)+" U"],
    ["非现金仓位", money(t.invested)+" U"],
    ["浮动盈亏", (t.pnl>=0?"+":"")+money(t.pnl)+" U"]
  ].map(([k,v])=>`<div class="kpi"><span>${k}</span><b>${v}</b></div>`).join("");
  document.getElementById("lots").innerHTML = lots.map((l,i) => {
    const v = mv(l);
    const p = v - Number(l.cost||0);
    const cls = p>0.005?"up":p<-0.005?"down":"";
    return `<div class="card">
      <div class="row"><div><div class="name">${l.name}</div><div class="ticker">${l.ticker}</div></div>
      <div class="mv ${cls}">${money(v)} U<div style="font-size:12px">${p>=0?"+":""}${money(p)}</div></div></div>
      <div class="grid">
        <label>股数<input data-i="${i}" data-k="shares" value="${l.shares}" inputmode="decimal"></label>
        <label>总成本 U<input data-i="${i}" data-k="cost" value="${l.cost}" inputmode="decimal"></label>
        <label>现价<input data-i="${i}" data-k="price" value="${l.price}" inputmode="decimal" ${l.type==="cash"?"disabled":""}></label>
        <label>单股成本<input value="${l.shares>0?(l.cost/l.shares).toFixed(2):"—"}" disabled></label>
      </div>
    </div>`;
  }).join("");
  document.querySelectorAll("input[data-k]").forEach(el => {
    el.addEventListener("change", () => {
      const i = Number(el.dataset.i);
      const k = el.dataset.k;
      const n = Number(el.value);
      if (!Number.isFinite(n)) return;
      lots[i][k] = n;
      if (lots[i].type === "cash" && (k==="shares"||k==="cost")) {
        lots[i].shares = n; lots[i].cost = n; lots[i].price = 1;
      }
      render();
    });
  });
}
document.getElementById("save").onclick = () => {
  localStorage.setItem(KEY, JSON.stringify({lots, savedAt: Date.now()}));
  document.getElementById("status").textContent = "已保存 " + new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"});
};
async function priceOf(ticker) {
  const pair = ticker.toUpperCase().endsWith("B") ? ticker.toUpperCase()+"USDT" : ticker.toUpperCase()+"BUSDT";
  try {
    const r = await fetch("https://data-api.binance.vision/api/v3/ticker/price?symbol="+pair);
    const d = await r.json();
    const n = Number(d.price);
    if (n>0) return n;
  } catch {}
  return 0;
}
document.getElementById("quotes").onclick = async () => {
  const btn = document.getElementById("quotes");
  btn.textContent = "正在拉…";
  for (const l of lots) {
    if (l.type !== "stock" || !l.ticker) continue;
    const p = await priceOf(l.ticker);
    if (p) l.price = p;
  }
  btn.textContent = "拉取币安现价";
  document.getElementById("status").textContent = "现价已更新，点保存才记住";
  render();
};
render();
</script>
</body>
</html>
