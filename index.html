<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>持仓地图</title>
  <style>
    :root { --bg:#f3f5f7; --card:#fff; --ink:#1b2430; --muted:#6b7785; --line:#e8edf2; --up:#0f9d58; --down:#d93025; }
    *{box-sizing:border-box}
    body{margin:0;font-family:"PingFang SC","Noto Sans SC","Helvetica Neue",sans-serif;background:var(--bg);color:var(--ink)}
    .wrap{max-width:1180px;margin:0 auto;padding:24px 16px 48px}
    h1{margin:0 0 6px;font-size:22px}
    .sub{color:var(--muted);font-size:13px;margin:0 0 16px}
    .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
    .stat{background:var(--card);border-radius:14px;padding:14px 16px;box-shadow:0 8px 20px rgba(20,30,45,.05)}
    .stat .k{font-size:12px;color:var(--muted)}
    .stat .v{font-size:20px;font-weight:700;margin-top:4px}
    .stat .s{font-size:12px;margin-top:2px;color:var(--muted)}
    .card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 8px 24px rgba(20,30,45,.06)}
    .table-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:13px;min-width:980px}
    th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
    th{color:var(--muted);font-weight:600;font-size:12px;white-space:nowrap}
    input,select{width:100%;border:1px solid #d9e0e7;border-radius:8px;padding:6px 8px;font:inherit;background:#fff}
    .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
    .up{color:var(--up)}
    .down{color:var(--down)}
    button{border:0;background:#1b2430;color:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600}
    .row-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
    .map-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
    #tree{width:100%;height:520px;border-radius:14px;overflow:hidden;background:#f7f8fa}
    .hint{font-size:12px;color:var(--muted);margin-top:10px}
    .nav{display:flex;gap:8px;margin:12px 0 16px;flex-wrap:wrap}
    .nav button{background:#e8edf2;color:#1b2430}
    .nav button.on{background:#1b2430;color:#fff}
    .page{display:none}
    .page.on{display:block}
    textarea{width:100%;min-height:220px;border:1px solid #d9e0e7;border-radius:10px;padding:10px;font:inherit;resize:vertical}
    #gate{position:fixed;inset:0;background:#f3f5f7;display:flex;align-items:center;justify-content:center;z-index:99}
    #gate.ok{display:none}
    .gate-box{background:#fff;border-radius:16px;padding:24px;width:min(360px,92vw);box-shadow:0 12px 32px rgba(20,30,45,.08)}
    .gate-box h2{font-size:18px;margin-bottom:8px}
    .gate-box p{font-size:13px;color:var(--muted);margin-bottom:12px}
    @media (max-width:800px){.stats{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
  <div id="gate">
    <div class="gate-box">
      <h2>持仓地图</h2>
      <p>输入访问码后才能看仓位。</p>
      <input id="gateInput" type="password" placeholder="访问码" />
      <div class="row-actions"><button type="button" id="gateGo">进入</button></div>
      <p id="gateErr" class="hint"></p>
    </div>
  </div>
  <div class="wrap" id="app" style="display:none">
    <h1>持仓地图</h1>
    <p class="sub">股数和成本自己填。点「拉取公开现价」更新股价。</p>
    <div class="nav">
      <button type="button" class="on" data-page="holdings">持仓</button>
      <button type="button" data-page="watch">观察池</button>
      <button type="button" data-page="notes">备忘</button>
    </div>
    <section class="page on" id="page-holdings">
      <section class="stats" id="stats"></section>
      <section class="card">
        <div class="table-wrap">
          <table>
            <thead><tr><th>名称</th><th>代码</th><th>类型</th><th>股数</th><th>单股成本</th><th>总成本 U</th><th>现价</th><th>当前市值 U</th><th>浮盈亏</th><th>仓位%</th><th>颜色</th><th></th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="row-actions">
          <button type="button" id="add">加一行</button>
          <button type="button" id="refreshPx" style="background:#0f7b4a">拉取公开现价</button>
          <button type="button" id="reset" style="background:#445261">恢复这份仓位</button>
          <span id="pxStatus" class="hint" style="margin:0;align-self:center"></span>
        </div>
      </section>
      <section class="card">
        <div class="map-head"><strong>持仓地图</strong><span class="sub" style="margin:0">方块面积 = 当前市值占比</span></div>
        <div id="tree"></div>
      </section>
    </section>
    <section class="page" id="page-watch"><section class="card"><textarea id="watchBox" placeholder="观察池"></textarea></section></section>
    <section class="page" id="page-notes"><section class="card"><textarea id="notesBox" placeholder="备忘"></textarea></section></section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
