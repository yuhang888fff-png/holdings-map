<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>Voyage Track （航迹投资）</title>
<link rel="icon" href="logo.png" type="image/png" />
<link rel="apple-touch-icon" href="logo.png" />
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Voyage Track" />
<meta name="theme-color" content="#0e1116" />
<style>
  :root {
    --paper:#f7f5f0; --card:#fff; --ink:#1e2329; --muted:#6f7680;
    --line:#e8e4dc; --up:#0ecb81; --down:#f6465d; --gold:#f0b90b;
    --donut-bg:#f0eee9;
  }
  body.dark {
    --paper:#0e1116; --card:#181c23; --ink:#e8eaed; --muted:#9aa0a6;
    --line:#2a3038; --up:#0ecb81; --down:#f6465d; --gold:#f0b90b;
    --donut-bg:#222830;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif; -webkit-font-smoothing:antialiased; transition:background .2s,color .2s; }
  main { max-width:680px; margin:0 auto; padding:20px 14px 48px; }
  @media (min-width:900px) {
    main { max-width:1040px; }
    .top-grid { display:grid; grid-template-columns:1.4fr 1fr; gap:14px; margin-bottom:14px; }
    .kpis { grid-template-columns:1fr 1fr; }
  }
  header { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:4px; }
  h1 { font-size:26px; margin:0 0 2px; font-weight:600; letter-spacing:-.3px; color:#c99a08; }
  p.sub { color:var(--muted); font-size:12.5px; margin:0 0 14px; }
  .meta { color:var(--muted); font-size:11.5px; margin-top:2px; }
  .theme-btn { height:32px; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; padding:0 10px; font-size:12px; cursor:pointer; }
  .kpis { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
  .kpi { background:var(--card); border-radius:18px; padding:14px 16px; border:1px solid var(--line); }
  .kpi span { font-size:12px; color:var(--muted); letter-spacing:.2px; }
  .kpi b { display:block; font-size:20px; margin-top:4px; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-.3px; color:var(--ink); }
  .kpi small { display:block; margin-top:3px; color:var(--muted); font-size:12px; }
  .kpi.wide { grid-column: 1 / -1; }
  .kpi.up b, .kpi.up small { color:#0a9d62; }
  .kpi.down b, .kpi.down small { color:var(--down); }
  .card { background:var(--card); border-radius:18px; padding:14px; margin-bottom:10px; border:1px solid var(--line); }
  .row { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .name { font-weight:600; font-size:16px; }
  .name.click:active { opacity:.6; }
  .ticker { color:var(--muted); font-size:11px; margin-top:1px; letter-spacing:.4px; }
  .del { border:1px solid #f5d0d4; background:var(--card); color:var(--down); font-size:12px; height:26px; padding:0 8px; border-radius:7px; margin-top:6px; }
  .fold { color:var(--muted); font-size:13px; margin:4px 4px 14px; padding:8px 0; cursor:pointer; }
  .mv { text-align:right; font-variant-numeric:tabular-nums; font-weight:600; font-size:16px; }
  .mv div { font-weight:400; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
  label { font-size:11px; color:var(--muted); display:block; letter-spacing:.2px; }
  input { width:100%; margin-top:4px; height:38px; border:1px solid var(--line); border-radius:10px; padding:0 10px; background:var(--paper); color:var(--ink); font-size:14px; font-variant-numeric:tabular-nums; }
  input:disabled { opacity:.7; }
  .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
  button { height:40px; border:0; border-radius:10px; padding:0 14px; font-size:13.5px; font-weight:600; cursor:pointer; }
  .accent { background:var(--gold); color:#1e2329; }
  .secondary { background:var(--card); color:var(--ink); border:1px solid var(--line); }
  .up { color:#0a9d62; } .down { color:var(--down); }
  .note { color:var(--muted); font-size:12px; align-self:center; flex:1; min-width:140px; }
  .sync-box { background:var(--card); border-radius:18px; padding:14px; border:1px solid var(--line); margin-top:12px; }
  .sync-row, .token-row { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .token-row { margin-bottom:0; }
  .chart-card { background:var(--card); border-radius:18px; padding:16px 12px 12px; margin:0 0 14px; border:1px solid var(--line); }
  .chart-high { text-align:center; color:#b0b4ba; font-size:13px; margin-bottom:2px; font-variant-numeric:tabular-nums; }
  .chart-low { color:#b0b4ba; font-size:13px; margin:0 0 10px 10px; font-variant-numeric:tabular-nums; }
  #chart { width:100%; height:160px; display:block; }
  .ranges { display:flex; justify-content:space-around; align-items:center; margin-top:2px; }
  .ranges button { height:30px; border:0; background:transparent; color:#b0b4ba; font-weight:500; border-radius:15px; padding:0 12px; font-size:13px; }
  .ranges button.on { background:var(--paper); color:#c99a08; }
  .chart-note { color:#b0b4ba; font-size:11px; text-align:center; margin-top:8px; line-height:1.4; }
  .chart-wrap { position:relative; }
  .tip { position:absolute; display:none; pointer-events:none; background:#1e2329; color:#fff; border-radius:8px; padding:5px 8px; font-size:12px; line-height:1.35; z-index:2; white-space:nowrap; }
  .tip b { display:block; font-size:13px; font-weight:600; color:var(--gold); }
  .alloc { background:var(--card); border-radius:18px; padding:16px; border:1px solid var(--line); margin-bottom:14px; }
  .alloc-row { display:flex; align-items:center; gap:16px; }
  .donut-wrap { width:140px; height:140px; flex-shrink:0; }
  .legend { flex:1; font-size:13px; }
  .legend-item { display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid var(--line); }
  .legend-item:last-child { border-bottom:0; }
  .swatch { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; }
  .conc { font-size:12.5px; color:var(--muted); margin-top:8px; }
  .treemap { background:var(--card); border-radius:18px; padding:16px; border:1px solid var(--line); margin-bottom:14px; }
  .treemap h3 { margin:0 0 10px; font-size:14px; font-weight:600; color:var(--ink); }
  .treemap-box { display:flex; flex-wrap:wrap; gap:4px; min-height:120px; }
  .tm-item { display:flex; align-items:center; justify-content:center; border-radius:8px; color:#1e2329; font-size:12px; font-weight:600; text-align:center; padding:6px; overflow:hidden; line-height:1.2; }
  .cost-note { color:var(--muted); font-size:11.5px; margin:0; grid-column:1 / -1; padding:0 2px 4px; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1 style="display:flex;align-items:center;gap:10px"><img src="logo.png" alt="" style="width:36px;height:36px;border-radius:8px;object-fit:cover">Voyage Track （航迹投资）</h1>
      <div class="meta" id="asof">Portfolio Snapshot · As of —</div>
    </div>
    <button class="theme-btn" id="theme">深色</button>
  </header>
  <p class="sub">改完可以先看数据。不保存就点「刷新」，会回到上次保存的仓位。 · <a href="13f.html" style="color:#c99a08">13F 披露</a></p>
  <div class="top-grid">
    <section class="chart-card">
      <div class="chart-high" id="chartHigh">—</div>
      <div class="chart-wrap">
        <div class="tip" id="tip"></div>
        <svg id="chart" viewBox="0 0 360 150" preserveAspectRatio="none"></svg>
      </div>
      <div class="chart-low" id="chartLow"></div>
      <div class="ranges" id="ranges"></div>
      <div class="chart-note" id="chartNote"></div>
    </section>
    <section class="alloc" id="alloc"></section>
  </div>
  <section class="treemap" id="treemap"></section>
  <section class="kpis" id="kpis"></section>
  <section id="lots"></section>
  <div class="actions">
    <button class="accent" id="save">保存仓位</button>
    <button class="secondary" id="reload">刷新</button>
    <button class="secondary" id="add">添加标的</button>
    <button class="secondary" id="undo">上一版</button>
    <button class="secondary" id="export">导出</button>
    <button class="secondary" id="import">导入</button>
    <input id="importFile" type="file" accept="application/json" hidden>
    <span class="note" id="status">没保存的改动，点刷新会还原</span>
    <button class="accent" id="quotes">拉取币安现价</button>
  </div>
  <div class="sync-box" id="syncBox">
    <div class="sync-row">
      <span class="note" id="syncStatus">未同步</span>
      <button class="secondary" id="syncNow">同步到云端</button>
      <button class="secondary" id="pullCloud">从云端拉取</button>
    </div>
    <div class="token-row">
      <input id="ghToken" type="password" placeholder="GitHub Token（只存这台设备，用于同步）" style="flex:1;height:36px">
      <button class="secondary" id="saveToken">保存Token</button>
    </div>
    <div class="note" style="margin-top:6px">Token 只存在本机浏览器，不会上传。同步用 GitHub 文件版本号，冲突会提示，不会乱覆盖。</div>
  </div>
</main>
<script>
const KEY = "holdings-map-phone-v5";
const SEED = [
  {id:"usdt",name:"现金 U",ticker:"USDT",type:"cash",shares:22150,cost:22150,price:1},
  {id:"crcl",name:"Circle",ticker:"CRCL",type:"stock",shares:140,cost:10800,price:66.94},
  {id:"rklb",name:"Rocket Lab",ticker:"RKLB",type:"stock",shares:57.7,cost:3750,price:45.8},
  {id:"otc",name:"场外基金",ticker:"OTC",type:"fund",shares:0,cost:3800,price:0},
  {id:"spcx",name:"SpaceX",ticker:"SPCX",type:"stock",shares:15.777,cost:2250,price:123.73},
  {id:"goog",name:"谷歌",ticker:"GOOG",type:"stock",shares:7.777,cost:2250,price:283.69}
];
let lots = load();
let showEmpty = false;
let focus = "";
const NAMES = {CRCL:"Circle",RKLB:"Rocket Lab",PDD:"拼多多",DRAM:"Memory ETF",NVDA:"英伟达",TSLA:"特斯拉",AAPL:"苹果",ASTS:"AST SpaceMobile",QQQ:"纳指ETF",SPCX:"SpaceX",GOOG:"谷歌"};
const SNAP = "holdings-map-snaps";
const COLORS = ["#f0b90b","#0ecb81","#5b8def","#f6465d","#a78bfa","#f59e0b","#94a3b8","#22d3ee"];
function isEmpty(l) { return l.type !== "cash" && !(Number(l.shares) > 0) && !(Number(l.cost) > 0); }
function costOf(list) { return (list||[]).reduce((a,b)=>a+Number(b.cost||0),0); }
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    const data = raw ? JSON.parse(raw) : null;
    if (data && Array.isArray(data.lots) && data.lots.length && costOf(data.lots) > 0) return data.lots;
  } catch {}
  return SEED.map(x => ({...x}));
}
function money(n) { return Number(n||0).toLocaleString("zh-CN", {maximumFractionDigits:2}); }
function mv(l) {
  if (l.type === "cash") return Number(l.shares) || Number(l.cost) || 0;
  if (Number(l.shares) > 0 && Number(l.price) > 0) return Number(l.shares) * Number(l.price);
  return Number(l.cost) || 0;
}
function totals() {
  const value = lots.reduce((a,b)=>a+mv(b),0);
  const cash = lots.filter(x=>x.type==="cash").reduce((a,b)=>a+mv(b),0);
  const cost = lots.reduce((a,b)=>a+Number(b.cost||0),0);
  const cashCost = lots.filter(x=>x.type==="cash").reduce((a,b)=>a+Number(b.cost||0),0);
  return {value, cash, cost, invested:value-cash, investedCost:cost-cashCost, pnl:value-cost, today:todayPnl()};
}
function todayPnl() {
  return lots.reduce((a, l) => {
    if (l.type !== "stock" || !(Number(l.shares) > 0) || !(Number(l.prev) > 0) || !(Number(l.price) > 0)) return a;
    return a + Number(l.shares) * (Number(l.price) - Number(l.prev));
  }, 0);
}
function todayBase() {
  return lots.reduce((a, l) => {
    if (l.type !== "stock" || !(Number(l.shares) > 0) || !(Number(l.prev) > 0)) return a;
    return a + Number(l.shares) * Number(l.prev);
  }, 0);
}
function pct(n) { return (n>=0?"+":"") + n.toFixed(2) + "%"; }
function share(part, whole) { return whole ? (part / whole * 100).toFixed(1) + "%" : "0%"; }
function render() {
  const t = totals();
  const up = t.pnl >= 0;
  const day = t.today;
  const dayUp = day >= 0;
  const now = new Date();
  document.getElementById("asof").textContent = "Portfolio Snapshot · As of " + now.toLocaleString("zh-CN",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}) + " · Prices: Binance Public";

  const positions = lots.map(l => ({l, v: mv(l)})).filter(x => x.v > 0.5).sort((a,b)=>b.v-a.v);
  const top1 = positions[0] ? positions[0].v / t.value * 100 : 0;
  const top3 = positions.slice(0,3).reduce((a,b)=>a+b.v,0) / t.value * 100;
  const maxNonCash = positions.filter(x=>x.l.type!=="cash")[0];
  const maxNonCashPct = maxNonCash ? maxNonCash.v / t.value * 100 : 0;

  const cards = [
    ["总成本", money(t.cost)+" U", "含现金", "wide"],
    ["总市值", money(t.value)+" U", "按现价", ""],
    ["现金 U", money(t.cash)+" U", share(t.cash, t.value), ""],
    ["非现金仓位", money(t.invested)+" U", share(t.invested, t.value), ""],
    ["非现金仓位成本", money(t.investedCost)+" U", "股票和基金本金", ""],
    ["浮动盈亏", (up?"+":"")+money(t.pnl)+" U", t.investedCost ? pct(t.pnl / t.investedCost * 100) : "—", up?"up":"down"],
    ["今日盈亏", (dayUp?"+":"")+money(day)+" U", todayBase() ? pct(day / todayBase() * 100) : "拉现价后显示", dayUp?"up":"down"],
    ["集中度", top1.toFixed(1)+"%", "前1大持仓", ""],
    ["前3集中度", top3.toFixed(1)+"%", "前3大持仓合计", ""],
  ];
  document.getElementById("kpis").innerHTML = cards.map(([k,v,s,tone])=>`<div class="kpi ${tone}"><span>${k}</span><b>${v}</b><small>${s}</small></div>`).join("") + `<div class="cost-note">总成本 = 现金本金 + 股票/基金本金。浮动盈亏 = 现价市值 − 总成本。</div>`;

  const totalV = t.value || 1;
  // Treemap
  const tmItems = positions.map((p, i) => {
    const pctv = p.v / totalV * 100;
    const flex = Math.max(pctv, 3);
    return `<div class="tm-item" style="flex:${flex} 1 ${flex}%; background:${COLORS[i % COLORS.length]}; min-width:${Math.max(pctv * 1.5, 48)}px" title="${p.l.name} ${share(p.v, totalV)}">${p.l.name}<br>${share(p.v, totalV)}</div>`;
  }).join("");
  document.getElementById("treemap").innerHTML = `<h3>仓位面积图 · 方块大小 = 市值占比</h3><div class="treemap-box">${tmItems}</div>`;

  // Donut
  let acc = 0;
  const segs = positions.map((p, i) => {
    const pctv = p.v / totalV;
    const start = acc;
    acc += pctv;
    return { ...p, start, end: acc, color: COLORS[i % COLORS.length] };
  });
  const r = 58, cx = 70, cy = 70, stroke = 18;
  const circ = 2 * Math.PI * r;
  let donut = `<svg viewBox="0 0 140 140" class="donut-wrap"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--donut-bg)" stroke-width="${stroke}"/>`;
  segs.forEach(s => {
    const len = (s.end - s.start) * circ;
    const offset = -s.start * circ;
    donut += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${stroke}" stroke-dasharray="${len} ${circ-len}" stroke-dashoffset="${offset}" stroke-linecap="butt" transform="rotate(-90 ${cx} ${cy})"/>`;
  });
  donut += `<text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="13" font-weight="600" fill="var(--ink)">${money(t.value)}</text><text x="${cx}" y="${cy+12}" text-anchor="middle" font-size="10" fill="var(--muted)">总市值</text></svg>`;
  const legend = segs.map(s => `<div class="legend-item"><span><span class="swatch" style="background:${s.color}"></span>${s.l.name}</span><span>${share(s.v, totalV)}</span></div>`).join("");
  document.getElementById("alloc").innerHTML = `<div class="alloc-row">${donut}<div class="legend">${legend}</div></div><div class="conc">前1大 ${top1.toFixed(1)}% · 前3大 ${top3.toFixed(1)}% · 最大非现金 ${maxNonCash ? maxNonCash.l.name + " " + maxNonCashPct.toFixed(1) + "%" : "—"}</div>`;

  const sortedLots = lots.map((l, i) => ({l, i, v: mv(l)})).sort((a, b) => b.v - a.v);
  document.getElementById("lots").innerHTML = sortedLots.map(({l, i}) => {
    if (isEmpty(l) && !showEmpty) return "";
    const v = mv(l);
    const p = v - Number(l.cost||0);
    const cls = p>0.005?"up":p<-0.005?"down":"";
    const day = (l.type==="stock" && Number(l.shares)>0 && Number(l.prev)>0 && Number(l.price)>0) ? Number(l.shares)*(Number(l.price)-Number(l.prev)) : null;
    const dayTxt = day==null ? "" : `<div style="font-size:12px">${day>=0?"+":""}${money(day)} 今日</div>`;
    const costPct = Number(l.cost) > 0 ? " " + pct(p / Number(l.cost) * 100) : "";
    const del = l.type === "cash" ? "" : `<button class="del" data-del="${i}">删除</button>`;
    return `<div class="card">
      <div class="row"><div><div class="name click" data-focus="${l.ticker||""}">${l.name}</div><div class="ticker">${l.ticker}</div></div>
      <div class="mv ${cls}">${money(v)} U<div style="font-size:12px">${p>=0?"+":""}${money(p)}${costPct}</div>${dayTxt}${del}</div></div>
      <div class="grid">
        <label>股数<input data-i="${i}" data-k="shares" value="${l.shares}" inputmode="decimal"></label>
        <label>总成本 U<input data-i="${i}" data-k="cost" value="${l.cost}" inputmode="decimal"></label>
        <label>现价<input data-i="${i}" data-k="price" value="${l.price}" inputmode="decimal" ${l.type==="cash"?"disabled":""}></label>
        <label>单股成本<input value="${l.shares>0?(l.cost/l.shares).toFixed(2):"—"}" disabled></label>
      </div>
    </div>`;
  }).join("") + (function(){
    const n = lots.filter(isEmpty).length;
    return n ? `<div class="fold" id="fold">${showEmpty?"收起":"已清仓 "+n+" 只，点开"}</div>` : "";
  })();
  const fold = document.getElementById("fold");
  if (fold) fold.onclick = () => { showEmpty = !showEmpty; render(); };
  document.querySelectorAll("[data-focus]").forEach(el => {
    el.onclick = () => {
      const t = el.dataset.focus;
      focus = focus === t ? "" : t;
      drawChart();
    };
  });
  document.querySelectorAll("input[data-k]").forEach(el => {
    el.addEventListener("change", () => {
      const i = Number(el.dataset.i);
      const k = el.dataset.k;
      const raw = String(el.value).trim();
      if (!raw || raw === "." || raw === "-") return;
      const n = Number(raw);
      if (!Number.isFinite(n)) return;
      lots[i][k] = n;
      if (lots[i].type === "cash" && (k==="shares"||k==="cost")) {
        lots[i].shares = n; lots[i].cost = n; lots[i].price = 1;
      }
      render();
    });
  });
  document.querySelectorAll("button[data-del]").forEach(el => {
    el.addEventListener("click", () => {
      lots.splice(Number(el.dataset.del), 1);
      render();
      drawChart();
    });
  });
}
document.getElementById("add").onclick = () => {
  const ticker = (prompt("代码，比如 CRCL") || "").toUpperCase().replace(/USDT$/, "");
  if (!ticker) return;
  const name = NAMES[ticker] || prompt("名称，比如 Circle") || ticker;
  lots.push({id:ticker.toLowerCase()+Date.now(), name, ticker, type:"stock", shares:0, cost:0, price:0});
  render();
  refreshQuotes();
};
function recordSnap() {
  const day = new Date().toISOString().slice(0,10);
  const snaps = JSON.parse(localStorage.getItem(SNAP) || "[]");
  const value = lots.reduce((a,b)=>a+mv(b),0);
  const i = snaps.findIndex(s => s.day === day);
  const row = {day, value, t: Date.now()};
  if (i >= 0) snaps[i] = row; else snaps.push(row);
  localStorage.setItem(SNAP, JSON.stringify(snaps.slice(-400)));
}
const GH_OWNER = "yuhang888fff-png";
const GH_REPO = "holdings-map";
const DATA_FILE = "data.json";
const RAW_URL = "https://raw.githubusercontent.com/" + GH_OWNER + "/" + GH_REPO + "/main/" + DATA_FILE;

function getToken() { return localStorage.getItem("holdings-gh-token") || ""; }
function setToken(t) { if (t) localStorage.setItem("holdings-gh-token", t); else localStorage.removeItem("holdings-gh-token"); }

async function fetchCloud() {
  const r = await fetch(RAW_URL + "?t=" + Date.now());
  if (!r.ok) throw new Error("fetch failed");
  return await r.json();
}

async function getFileSha(token) {
  const r = await fetch("https://api.github.com/repos/" + GH_OWNER + "/" + GH_REPO + "/contents/" + DATA_FILE, {
    headers: { Authorization: "Bearer " + token, Accept: "application/vnd.github+json" }
  });
  if (!r.ok) throw new Error("sha fetch failed");
  const d = await r.json();
  return d.sha;
}

async function pushToCloud(token, payload) {
  const sha = await getFileSha(token);
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(payload, null, 2))));
  const r = await fetch("https://api.github.com/repos/" + GH_OWNER + "/" + GH_REPO + "/contents/" + DATA_FILE, {
    method: "PUT",
    headers: { Authorization: "Bearer " + token, Accept: "application/vnd.github+json", "Content-Type": "application/json" },
    body: JSON.stringify({ message: "update holdings", content, sha })
  });
  if (r.status === 409) throw new Error("conflict");
  if (!r.ok) throw new Error("push failed");
  return true;
}

async function onePrice(url) {
  const ctrl = new AbortController();
  const stop = setTimeout(() => ctrl.abort(), 5000);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    if (!r.ok) return 0;
    const d = await r.json();
    return Number(d.price || d.data?.price || d.data?.lastPrice || 0);
  } catch { return 0; }
  finally { clearTimeout(stop); }
}
async function quoteOf(ticker) {
  const t = ticker.toUpperCase().replace(/USDT$/, "");
  const pair = t.endsWith("B") ? t + "USDT" : t + "BUSDT";
  const ctrl = new AbortController();
  const stop = setTimeout(() => ctrl.abort(), 5000);
  try {
    const r = await fetch("https://data-api.binance.vision/api/v3/ticker/24hr?symbol=" + pair, { signal: ctrl.signal });
    if (r.ok) {
      const d = await r.json();
      const price = Number(d.lastPrice || d.price || 0);
      const prev = Number(d.prevClosePrice || d.openPrice || 0);
      if (price > 0) return { price, prev };
    }
  } catch {}
  finally { clearTimeout(stop); }
  const price = await onePrice("https://www.binance.com/bapi/equity/v1/public/equity/market/get-latest-quote?symbol=" + t);
  return { price, prev: 0 };
}
let pulling = false;
async function refreshQuotes() {
  if (pulling) return;
  pulling = true;
  const btn = document.getElementById("quotes");
  const status = document.getElementById("status");
  btn.textContent = "正在拉…";
  try {
    const stocks = lots.filter(l => l.type === "stock" && l.ticker);
    const quotes = await Promise.all(stocks.map(l => quoteOf(l.ticker)));
    let n = 0;
    stocks.forEach((l, i) => {
      if (quotes[i].price) { l.price = quotes[i].price; n++; }
      if (quotes[i].prev) l.prev = quotes[i].prev;
    });
    const now = new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
    status.textContent = n ? "币安现价 " + now + "，点保存才记住" : "没拉到币安价，还是上次价格";
    recordSnap();
  } catch {
    status.textContent = "拉价失败，还是上次价格";
  } finally {
    btn.textContent = "拉取币安现价";
    pulling = false;
    render();
    drawChart();
  }
}

const RANGES = [
  {id:"1d", label:"1天", interval:"1h", limit:24},
  {id:"7d", label:"7天", interval:"1h", limit:168},
  {id:"30d", label:"30天", interval:"1d", limit:30},

async function klines(ticker, interval, limit) {
  const t = ticker.toUpperCase().replace(/USDT$/, "");
  const pairs = t.endsWith("B") ? [t + "USDT"] : [t + "BUSDT", t + "USDT"];
  const hosts = [
    "https://data-api.binance.vision",
    "https://www.binance.com"
  ];
  for (const pair of pairs) {
    for (const host of hosts) {
      for (let attempt = 0; attempt < 2; attempt++) {
        const ctrl = new AbortController();
        const stop = setTimeout(() => ctrl.abort(), 12000);
        try {
          const r = await fetch(host + "/api/v3/klines?symbol=" + pair + "&interval=" + interval + "&limit=" + limit, { signal: ctrl.signal });
          if (r.ok) {
            const d = await r.json();
            if (Array.isArray(d)) {
              const out = d.map(x => [x[0], Number(x[4])]).filter(x => x[1] > 0);
              if (out.length) return out;
            }
          }
        } catch {}
        finally { clearTimeout(stop); }
      }
    }
  }
  return [];
}
let chartPts = [];
function paint(values, times) {
  const svg = document.getElementById("chart");
  chartPts = [];
  if (!values.length) {
    document.getElementById("chartHigh").textContent = "没拉到历史";
    document.getElementById("chartLow").textContent = "";
    svg.innerHTML = "";
    return;
  }
  const hi = Math.max(...values);
  const lo = Math.min(...values);
  document.getElementById("chartHigh").textContent = "$" + money(hi);
  document.getElementById("chartLow").textContent = "$" + money(lo);
  const w = 360, h = 150, pad = 6;
  const span = hi - lo || 1;
  const pts = values.map((v, i) => {
    const x = values.length === 1 ? w / 2 : pad + i * (w - pad * 2) / (values.length - 1);
    const y = pad + (hi - v) / span * (h - pad * 2);
    return [x, y];
  });
  chartPts = pts.map((p, i) => ({x:p[0], y:p[1], v:values[i], t:times && times[i]}));
  const line = pts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  const area = `0,${h} ` + line + ` ${w},${h}`;
  svg.innerHTML = `<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f0b90b" stop-opacity=".4"/><stop offset="100%" stop-color="#f0b90b" stop-opacity=".02"/></linearGradient></defs><polygon points="${area}" fill="url(#g)"/><polyline points="${line}" fill="none" stroke="#f0b90b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line id="cross" x1="0" y1="0" x2="0" y2="${h}" stroke="#eaecef" stroke-opacity=".3" stroke-width="1" visibility="hidden"/>`;
}
function showTip(e) {
  const tip = document.getElementById("tip");
  const svg = document.getElementById("chart");
  const rect = svg.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width * 360;
  if (!chartPts.length) { tip.style.display = "none"; return; }
  let best = chartPts[0], bestD = Infinity;
  chartPts.forEach(p => { const d = Math.abs(p.x - x); if (d < bestD) { bestD = d; best = p; } });
  tip.style.display = "block";
  tip.style.left = (best.x / 360 * 100) + "%";
  tip.style.top = (best.y / 150 * 100 - 8) + "%";
  const d = best.t ? new Date(best.t).toLocaleString("zh-CN",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}) : "";
  tip.innerHTML = `<b>${money(best.v)} U</b>${d}`;
  const cross = document.getElementById("cross");
  if (cross) { cross.setAttribute("x1", best.x); cross.setAttribute("x2", best.x); cross.setAttribute("visibility", "visible"); }
}
document.getElementById("chart").addEventListener("mousemove", showTip);
document.getElementById("chart").addEventListener("mouseleave", () => {
  document.getElementById("tip").style.display = "none";
  const cross = document.getElementById("cross");
  if (cross) cross.setAttribute("visibility", "hidden");
});
async function drawChart() {
  const gen = ++chartGen;
  const spec = RANGES.find(r => r.id === range);
  const nowValue = lots.reduce((a,b)=>a+mv(b),0);
  try {
    if (focus) {
      const lot = lots.find(l => l.ticker === focus && l.type === "stock");
      const series = lot ? await klines(focus, spec.interval, spec.limit) : [];
      if (gen !== chartGen) return;
      if (!series.length) { paint([]); document.getElementById("chartNote").textContent = focus + " 没拉到历史"; return; }
      paint(series.map(x => x[1]), series.map(x => x[0]));
      document.getElementById("chartNote").textContent = focus + " 现价曲线，再点名称回到总仓";
      return;
    }
    const stocks = lots.filter(l => l.type === "stock" && Number(l.shares) > 0 && l.ticker);
    const cash = lots.filter(l => l.type === "cash").reduce((a,b)=>a+mv(b),0);
    const fixed = lots.filter(l => l.type !== "stock" && l.type !== "cash").reduce((a,b)=>a+mv(b),0);
    if (!stocks.length) { paint([cash + fixed]); document.getElementById("chartNote").textContent = ""; return; }
    const series = await Promise.all(stocks.map(l => klines(l.ticker, spec.interval, spec.limit)));
    const missing = stocks.filter((l, i) => !series[i].length).map(l => l.ticker);
    const usable = stocks.map((l, i) => ({l, s: series[i]})).filter(x => x.s.length);
    const times = [...new Set(usable.flatMap(x => x.s.map(p => p[0])))].sort((a,b)=>a-b);
    if (!times.length) { paint([]); document.getElementById("chartNote").textContent = "没拉到历史"; return; }
    const maps = usable.map(x => new Map(x.s));
    const last = usable.map(() => 0);
    const values = [];
    const usedTimes = [];
    for (const t of times) {
      let ready = true;
      const px = last.slice();
      usable.forEach((x, i) => {
        if (maps[i].has(t)) px[i] = maps[i].get(t);
        if (!(px[i] > 0)) ready = false;
      });
      if (!ready) continue;
      last.splice(0, last.length, ...px);
      let v = cash + fixed;
      usable.forEach((x, i) => { v += Number(x.l.shares) * px[i]; });
      values.push(v);
      usedTimes.push(t);
    }
    if (gen !== chartGen) return;
    if (values.length) values[values.length - 1] = nowValue;
    paint(values, usedTimes);
    const note = "按当前股数 × 币安历史价，含现金和基金，终点是现在总市值" + (missing.length ? "。缺历史未计入：" + missing.join(" ") : "");
    document.getElementById("chartNote").textContent = note;
  } catch {
    if (gen === chartGen) paint([]);
  }
}
